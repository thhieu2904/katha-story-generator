# Katha backend — homeserver deployment.
#
# Homeserver này không có IPv4 public (CGNAT) nên đường public chính thức là
# Cloudflare Tunnel: cloudflared mở kết nối RA NGOÀI tới Cloudflare, Cloudflare
# route api.<domain> -> tunnel -> api:8000. Không cần mở port router.
#
# Container api cũng join network `proxy` (external, của caddy_proxy có sẵn
# trên server) với alias `katha-api` — nếu sau này muốn route nội bộ LAN qua
# Caddy thì chỉ cần thêm block reverse_proxy katha-api:8000.
#
# Same rule as the VPS compose: exactly ONE api container (in-process
# image-generation runner, D35).
#
# Usage (đặt tại /srv/apps/katha-story-generator theo convention server):
#   cd deploy
#   docker compose -f docker-compose.homeserver.yml up -d --build
#   docker compose -f docker-compose.homeserver.yml exec api alembic upgrade head

services:
  api:
    build:
      context: ../backend
    env_file: .env
    restart: unless-stopped
    networks:
      default: {}
      proxy:
        aliases:
          - katha-api
    # Trần tài nguyên (plan/13 §3.5): CPU chạm trần thì chậm lại, RAM chạm
    # trần thì container này bị kill + tự restart — không lây sang app khác.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # NOTE: cloudflared sẽ chuyển sang stack riêng /srv/tunnel khi migration
  # multi-app (plan/13 §7 giai đoạn A) — đừng xoá ở đây trước khi stack mới
  # chạy và dashboard hiện 2 connector.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      default: {}
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
