# Katha backend — homeserver deployment.
#
# Homeserver này không có IPv4 public (CGNAT) nên đường public chính thức là
# Cloudflare Tunnel. Từ 2026-07-27 (migration plan/13 §7A), cloudflared KHÔNG
# còn nằm trong compose này — nó là hạ tầng chung, chạy ở stack riêng
# /srv/tunnel trên server, join network `proxy` và gọi vào đây qua alias.
#
# Container api join network `proxy` (external, của caddy_proxy có sẵn trên
# server) với alias `katha-api` — cloudflared/Caddy đều gọi backend qua đường
# này. KHÔNG dùng tên service trần `api` làm target ở bất cứ đâu (plan/13 §2.1).
#
# Same rule as the VPS compose: exactly ONE api container (in-process
# image-generation runner, D35).
#
# Usage (đặt tại /srv/apps/katha-story-generator theo convention server):
#   cd deploy
#   docker compose -f docker-compose.homeserver.yml up -d --build
#   docker compose -f docker-compose.homeserver.yml exec api alembic upgrade head

services:
  api:
    build:
      context: ../backend
    env_file: .env
    restart: unless-stopped
    networks:
      default: {}
      proxy:
        aliases:
          - katha-api
    # Trần tài nguyên (plan/13 §3.5): CPU chạm trần thì chậm lại, RAM chạm
    # trần thì container này bị kill + tự restart — không lây sang app khác.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
