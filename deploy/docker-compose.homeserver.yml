# Katha backend — homeserver deployment.
#
# Default topology: host Caddy (bạn đã dựng sẵn) nhận HTTPS public và
# reverse_proxy về 127.0.0.1:8000. Compose này chỉ chạy api, bind vào
# loopback nên không lộ port ra ngoài — chỉ Caddy trên host thấy được.
#
#   api.<domain> {
#       reverse_proxy 127.0.0.1:8000
#   }
#
# Fallback khi không có IP public/CGNAT: bật thêm Cloudflare Tunnel:
#   docker compose -f docker-compose.homeserver.yml --profile tunnel up -d
#   (cần TUNNEL_TOKEN trong .env; xem plan/11-deploy-homeserver.md)
#
# Same rule as the VPS compose: exactly ONE api container (in-process
# image-generation runner, D35).
#
# Usage:
#   cd deploy
#   docker compose -f docker-compose.homeserver.yml up -d --build
#   docker compose -f docker-compose.homeserver.yml exec api alembic upgrade head

services:
  api:
    build:
      context: ../backend
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - api
